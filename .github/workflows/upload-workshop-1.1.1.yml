name: Upload existing Workshop 1.1.1 to CurseForge
on:
  push:
    branches: ['publish/workshop-1.1.1']
    paths: ['release/1.1.1/**', '.github/workflows/upload-workshop-1.1.1.yml', '.github/scripts/upload_workshop_1_1_1.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curseforge-workshop-1.1.1
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the existing JAR and full HTML changelog
        env:
          CURSEFORGE_TOKEN: ${{ secrets.curseforge_token }}
        run: python3 .github/scripts/upload_workshop_1_1_1.py
      - name: Save the upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: workshop-1.1.1-curseforge-receipt
          path: curseforge-upload-result.json
