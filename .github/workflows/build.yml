name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate mod metadata and JSON assets
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          with Path('src/main/resources/META-INF/neoforge.mods.toml').open('rb') as stream:
              tomllib.load(stream)
          for path in Path('src/main/resources').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Build and run integration tests
        run: ./gradlew build runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: towns-and-kingdoms-workshop
          path: build/libs/*.jar
